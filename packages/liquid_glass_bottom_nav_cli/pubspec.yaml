name: liquid_glass_bottom_nav_cli
description: "Installs liquid_glass_bottom_nav_native into a Flutter project and configures the native iOS side it needs to render."
version: 0.1.0

# TODO: required before `dart pub publish` — must be a real, reachable URL.
repository: https://github.com/UjjvalGandhi/liquid_glass_bottom_nav

environment:
  sdk: ^3.12.1

# Pure Dart on purpose: depending on the Flutter SDK here would make
# `dart pub global activate` unreliable on machines that only have Dart.
dependencies:
  args: ^2.6.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  liquid_glass:
